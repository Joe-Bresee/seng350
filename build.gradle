plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0' apply false
}
subprojects {

    apply plugin: 'java'
    apply plugin: 'com.zeroc.gradle.ice-builder.slice'
    repositories {
        mavenCentral()
    }

    slice {
        // Overriding ICE location for using w/ VM
        def localIceHome = file("${System.getProperty('user.home')}/.local/ice")
        iceHome = findProperty('iceHome') ?: System.getenv('ICE_HOME') ?:
            (localIceHome.exists() ? localIceHome : '/usr')
        java {
            files = [file("../Callback.ice")]
        }
    }

    dependencies {
        implementation 'com.zeroc:ice:3.7.9'
    }

    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            configurations.runtimeClasspath.collect {
                it.isDirectory() ? it : zipTree(it)
            }
        }
        manifest {
            attributes(
            "Main-Class" : project.name.capitalize()
        )
    }
}
}